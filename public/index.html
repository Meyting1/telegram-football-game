<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>NEON PITCH</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b18;color:#eef7ff;font-family:Tahoma,Arial,sans-serif;min-height:100vh}
.wrap{max-width:980px;margin:auto;padding:18px}.brand{text-align:center;font-weight:900;letter-spacing:3px;color:#65f7ff;font-size:28px;text-shadow:0 0 18px #00d9ff;margin:8px 0}
.sub{text-align:center;color:#9fb6d1;font-size:13px;margin-bottom:18px}
.panel{background:#101a30;border:1px solid #244466;border-radius:16px;padding:14px;margin:12px 0;box-shadow:0 0 22px #00b8ff12}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:110px}
input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #34516f;background:#0a1224;color:white}
button{background:linear-gradient(120deg,#087fbd,#7c3aed);border:0;font-weight:bold;cursor:pointer}
button:disabled{opacity:.4}
#status{color:#8ff8ff;text-align:center;min-height:24px;margin:8px}
.score{display:flex;justify-content:space-between;align-items:center;font-weight:bold;font-size:18px}
#timer{color:#ffdb73}
canvas{display:block;width:100%;height:auto;border-radius:14px;border:1px solid #2c6d8a;background:#071c2a;touch-action:none}
.hint{text-align:center;color:#a8bed4;font-size:12px;line-height:1.8}
.hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">NEON PITCH</div>
  <div class="sub">فوتبال دیسکی آنلاین • نسخه آزمایشی</div>

  <div class="panel" id="lobby">
    <div class="row">
      <input id="playerName" maxlength="18" placeholder="نام بازیکن" value="Player">
      <button id="createBtn">ساخت اتاق جدید</button>
    </div>
    <div class="row" style="margin-top:9px">
      <input id="roomInput" maxlength="8" placeholder="کد اتاق">
      <button id="joinBtn">ورود به اتاق</button>
    </div>
    <div id="status">برای شروع، اتاق بساز یا کد اتاق دوستت را وارد کن.</div>
  </div>

  <div class="panel hidden" id="gamePanel">
    <div class="score">
      <span>آبی: <b id="scoreA">0</b></span>
      <span id="roomLabel">اتاق: -----</span>
      <span>صورتی: <b id="scoreB">0</b></span>
    </div>
    <div class="score" style="font-size:14px;margin:10px 0">
      <span id="turnLabel">نوبت: --</span>
      <span id="timer">15</span>
    </div>
    <canvas id="board" width="900" height="560"></canvas>
    <div class="hint">مهره خودت را لمس کن و به عقب بکش؛ سپس رها کن تا شلیک شود. هر نوبت ۱۵ ثانیه فرصت انتخاب دارد.</div>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
(() => {
  const socket = io();
  const $ = id => document.getElementById(id);
  const lobby = $("lobby"), gamePanel = $("gamePanel"), status = $("status");
  const canvas = $("board"), ctx = canvas.getContext("2d");
  let mySlot = null, game = null, dragging = null, dragNow = null;

  function setStatus(message) { status.textContent = message; }
  function name() { return $("playerName").value.trim() || "Player"; }

  $("createBtn").addEventListener("click", () => {
    setStatus("در حال ساخت اتاق...");
    socket.emit("createRoom", { name: name() });
  });
  $("joinBtn").addEventListener("click", () => {
    const code = $("roomInput").value.trim().toUpperCase();
    if (!code) return setStatus("اول کد اتاق را وارد کن.");
    setStatus("در حال ورود به اتاق...");
    socket.emit("joinRoom", { code, name: name() });
  });

  socket.on("connect", () => setStatus("اتصال برقرار شد؛ اتاق بساز یا وارد اتاق شو."));
  socket.on("connect_error", () => setStatus("اتصال به سرور برقرار نشد؛ صفحه را دوباره بارگذاری کن."));
  socket.on("notice", message => setStatus(message));
  socket.on("joined", data => {
    mySlot = data.slot;
    $("roomInput").value = data.code;
    $("roomLabel").textContent = "کد: " + data.code;
    lobby.classList.add("hidden");
    gamePanel.classList.remove("hidden");
    setStatus("");
  });
  socket.on("state", state => {
    game = state;
    if (state.roomCode) $("roomLabel").textContent = "کد: " + state.roomCode;
    $("scoreA").textContent = state.scores[0];
    $("scoreB").textContent = state.scores[1];
    const turnName = state.players[state.turn] || (state.turn === 0 ? "آبی" : "صورتی");
    $("turnLabel").textContent = state.status === "waiting" ? "منتظر بازیکن دوم..." : "نوبت: " + turnName;
    if (state.status === "waiting") setStatus("اتاق ساخته شد. کد را برای بازیکن دوم بفرست: " + state.roomCode);
    else setStatus("");
    draw();
  });
  socket.on("goal", () => {
    try {
      const audio = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audio.createOscillator(), gain = audio.createGain();
      osc.frequency.setValueAtTime(520, audio.currentTime);
      osc.frequency.exponentialRampToValueAtTime(880, audio.currentTime + .18);
      gain.gain.setValueAtTime(.12, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(.001, audio.currentTime + .35);
      osc.connect(gain); gain.connect(audio.destination); osc.start(); osc.stop(audio.currentTime + .36);
    } catch(e) {}
  });

  function point(e) {
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) * canvas.width / rect.width,
             y: (e.clientY - rect.top) * canvas.height / rect.height };
  }
  function canShoot() {
    return game && game.status === "playing" && game.turn === mySlot &&
      ![...game.discs, game.ball].some(o => Math.abs(o.vx) > .1 || Math.abs(o.vy) > .1);
  }
  canvas.addEventListener("pointerdown", e => {
    if (!canShoot()) return;
    const p = point(e);
    const disc = [...game.discs].reverse().find(d => d.team === mySlot && Math.hypot(d.x-p.x,d.y-p.y) < 25);
    if (disc) { dragging = disc; dragNow = p; canvas.setPointerCapture(e.pointerId); }
  });
  canvas.addEventListener("pointermove", e => { if (dragging) { dragNow = point(e); draw(); } });
  canvas.addEventListener("pointerup", e => {
    if (!dragging) return;
    const p = point(e), dx = dragging.x - p.x, dy = dragging.y - p.y;
    const power = Math.min(14, Math.hypot(dx,dy) / 7);
    if (power > .5) socket.emit("shoot", { discId: dragging.id, dx, dy, power });
    dragging = null; dragNow = null; draw();
  });
  function draw() {
    if (!game) return;
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0,0,w,h);
    const grad = ctx.createLinearGradient(0,0,w,h);
    grad.addColorStop(0,"#09283a"); grad.addColorStop(1,"#071426");
    ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle="#1b6072"; ctx.lineWidth=4; ctx.strokeRect(22,22,w-44,h-44);
    ctx.strokeStyle="#1b6072"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(w/2,22); ctx.lineTo(w/2,h-22); ctx.stroke();
    ctx.beginPath(); ctx.arc(w/2,h/2,75,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle="#65f7ff"; ctx.lineWidth=5;
    ctx.strokeRect(0,215,30,130); ctx.strokeRect(w-30,215,30,130);
    ctx.fillStyle="#0b3850"; ctx.fillRect(0,215,25,130); ctx.fillRect(w-25,215,25,130);

    for (const d of game.discs) {
      const color = d.team === 0 ? "#31d9ff" : "#ff4fbc";
      ctx.shadowBlur=18; ctx.shadowColor=color; ctx.fillStyle=color;
      ctx.beginPath(); ctx.arc(d.x,d.y,16,0,Math.PI*2); ctx.fill();
      ctx.shadowBlur=0; ctx.strokeStyle="#e9fbff"; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(d.x,d.y,9,0,Math.PI*2); ctx.stroke();
      if (d.team === mySlot && canShoot()) {
        ctx.strokeStyle="#b8faff88"; ctx.lineWidth=1;
        ctx.beginPath(); ctx.arc(d.x,d.y,21,0,Math.PI*2); ctx.stroke();
      }
    }
    ctx.shadowBlur=16; ctx.shadowColor="#fff18a"; ctx.fillStyle="#fff18a";
    ctx.beginPath(); ctx.arc(game.ball.x,game.ball.y,9,0,Math.PI*2); ctx.fill(); ctx.shadowBlur=0;
    if (dragging && dragNow) {
      const dx=dragging.x-dragNow.x, dy=dragging.y-dragNow.y;
      ctx.strokeStyle="#fff18a"; ctx.lineWidth=4; ctx.setLineDash([10,8]);
      ctx.beginPath(); ctx.moveTo(dragging.x,dragging.y);
      ctx.lineTo(dragging.x+dx*2,dragging.y+dy*2); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle="#fff18a"; ctx.font="18px Arial";
      ctx.fillText("POWER " + Math.round(Math.min(14,Math.hypot(dx,dy)/7)), 35, 48);
    }
    $("timer").textContent = game.status === "playing"
      ? Math.max(0, Math.ceil((game.turnEndsAt - Date.now())/1000)) + "s" : "--";
  }
  setInterval(() => { if (game) draw(); }, 100);
})();
</script>
</body>
</html>
